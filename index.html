<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Magnet Studio</title>
<meta name="description" content="Little Magnet Studio makes small, playful mobile games and apps.">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#15123A; color:#fff; padding:48px 20px;
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:30px; margin:0 0 4px; letter-spacing:.02em; }
  .lead { margin:0 0 32px; opacity:.75; }
  .app { display:flex; gap:16px; align-items:center; background:rgba(255,255,255,.07); border-radius:20px; padding:16px; margin-bottom:12px; }
  .app img { width:72px; height:72px; border-radius:18px; flex:none; }
  .app h2 { font-size:19px; margin:0; }
  .app p { margin:2px 0 6px; opacity:.75; font-size:14px; }
  .app a { color:#ff9bb3; font-size:14px; margin-right:12px; }
  footer { margin-top:40px; font-size:14px; opacity:.6; }
  footer a { color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Little Magnet Studio</h1>
  <p class="lead">Small, playful games and apps.</p>

  <div class="app">
    <img src="img/icon-256.png" alt="PEACH POP icon">
    <div>
      <h2>PEACH POP</h2>
      <p>Pop the numbered peaches in order. Beat the clock.</p>
      <a href="https://play.google.com/store/apps/details?id=com.peachpop.game">Google Play</a>
      <a href="peachpop/privacy/">Privacy Policy</a>
    </div>
  </div>

  <footer><a href="mailto:__CONTACT__">__CONTACT__</a></footer>
</main>
</body>
</html>
